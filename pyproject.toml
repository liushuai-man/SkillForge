[project]
name = "skillforge-vm"
version = "0.1.0"
description = "SkillForge 版本管理器：为高频修改而生的 Skill 版本内核（保存即快照，比较即结论）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # M-10 接口层
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    # 配置与报文校验（一套模型同时管配置 / 接口 / 报告）
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # M-02 改动监听（自带抖动合并）
    "watchfiles>=1.0",
    # M-12 命令行客户端
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    # M-05 L2 / M-06 结构化解析
    "tree-sitter>=0.24",
    "tree-sitter-markdown>=0.3",
    "tree-sitter-yaml>=0.7",
    "tree-sitter-json>=0.24",
]

[project.scripts]
skillforge-vm = "skillforge_vm.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillforge_vm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"